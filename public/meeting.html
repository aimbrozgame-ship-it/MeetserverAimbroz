<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MeetserverAimbroz Meeting</title><link rel="stylesheet" href="meeting.css"></head><body><header><div class="brand"><span class="logo">M</span>Meetserver<span>Aimbroz</span></div><div class="roominfo"><span id="roomLabel">ROOM</span><button id="copy">Copy invite</button></div><div class="count">👥 <b id="count">1</b>/10</div></header><main><section id="grid" class="grid"></section><aside id="chat" class="chat hidden"><div class="chat-head">Meeting chat <button id="closeChat">×</button></div><div id="messages" class="messages"></div><div class="chat-send"><input id="chatInput" placeholder="Type a message…"><button id="send">➤</button></div></aside></main><footer><div class="controls"><button id="mic">🎤<small>Mute</small></button><button id="cam">📹<small>Camera</small></button><button id="share">🖥️<small>Share screen</small></button><button id="chatBtn">💬<small>Chat</small></button><button id="leave" class="leave">☎<small>Leave</small></button></div></footer><div id="nameModal" class="modal"><div><h2>Join meeting</h2><input id="displayName" maxlength="30" placeholder="Your name"><button id="join" class="primary">Join meeting →</button><p id="err"></p></div></div><script src="/socket.io/socket.io.js"></script><script src="meeting.js"></script></body></html>
